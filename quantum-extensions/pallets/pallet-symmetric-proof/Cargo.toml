[package]
name = "pallet-symmetric-proof"
version = "0.1.0"
authors = ["Quantum Harmony Team"]
edition = "2021"
license = "Apache-2.0"
description = "Substrate pallet for symmetric encryption with STARK proofs"

[dependencies]
# Substrate dependencies
frame-support = { workspace = true }
frame-system = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
sp-core = { workspace = true }
codec = { package = "parity-scale-codec", version = "3.6.1", features = ["derive"] }
scale-info = { version = "2.5.0", features = ["derive"] }

# Quantum dependencies
sp-stark-crypto = { path = "../../primitives/stark-crypto" }
sp-proof-storage = { path = "../../primitives/proof-storage" }
sp-quantum-wrapper = { path = "../../../substrate/primitives/quantum-wrapper" }

# Optional benchmarking
frame-benchmarking = { workspace = true, optional = true }

[dev-dependencies]
sp-io = { workspace = true }

[features]
default = ["std"]
std = [
    "frame-support/std",
    "frame-system/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-core/std",
    "codec/std",
    "scale-info/std",
    "sp-stark-crypto/std",
    "sp-quantum-wrapper/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
]
try-runtime = ["frame-support/try-runtime"]
[package]
name = "sp-stark-crypto"
version = "0.1.0"
authors = ["Quantum Harmony Team"]
edition = "2021"
license = "Apache-2.0"
description = "STARK proof generation and verification for symmetric encryption operations"

[dependencies]
# Substrate dependencies
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
codec = { package = "parity-scale-codec", version = "3.6.1", features = ["derive"] }
scale-info = { version = "2.5.0", features = ["derive"] }

# Cryptographic dependencies
winterfell = { version = "0.7", default-features = false }
blake3 = { version = "1.5", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }

# Quantum primitives (from our workspace)
sp-quantum-wrapper = { path = "../../../substrate/primitives/quantum-wrapper" }

[features]
default = ["std"]
std = [
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "codec/std",
    "scale-info/std",
    "winterfell/std",
    "blake3/std",
    "chacha20poly1305/std",
    "sha3/std",
]
[package]
name = "sp-proof-storage"
version = "0.1.0"
authors = ["Quantum Harmony Team"]
edition = "2021"
license = "Apache-2.0"
description = "Proof storage primitives for quantum blockchain"

[dependencies]
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-std = { workspace = true }
codec = { package = "parity-scale-codec", version = "3.6.1", features = ["derive"] }
scale-info = { version = "2.5.0", features = ["derive"] }

[features]
default = ["std"]
std = [
    "sp-core/std",
    "sp-runtime/std",
    "sp-std/std",
    "codec/std",
    "scale-info/std",
]
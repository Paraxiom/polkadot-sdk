[package]
name = "sp-consensus-poc"
version = "1.0.0"
authors = ["QuantumVerse Protocols"]
edition = "2021"
license = "Apache-2.0"
description = "Proof of Coherence consensus primitives for quantum democracy"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6", default-features = false }
scale-info = { version = "2.11", default-features = false, features = ["derive"] }
sp-api = { path = "../../api", default-features = false }
sp-application-crypto = { path = "../../application-crypto", default-features = false }
sp-consensus-slots = { path = "../slots", default-features = false }
sp-core = { path = "../../core", default-features = false }
sp-inherents = { path = "../../inherents", default-features = false }
sp-runtime = { path = "../../runtime", default-features = false }
sp-std = { path = "../../std", default-features = false }
sp-timestamp = { path = "../../timestamp", default-features = false }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "sp-api/std",
    "sp-application-crypto/std",
    "sp-consensus-slots/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-runtime/std",
    "sp-std/std",
    "sp-timestamp/std",
]
[workspace]
resolver = "2"

members = [
    # Quantum extensions
    "quantum-extensions/pallets/pallet-quantum-crypto",
    "quantum-extensions/pallets/pallet-qkd-network", 
    "quantum-extensions/pallets/pallet-symmetric-proof",
    "quantum-extensions/pallets/pallet-quantum-democracy",
    "quantum-extensions/primitives/stark-crypto",
    "quantum-extensions/primitives/proof-storage",
    
    # Core substrate components (minimal)
    "substrate/frame/system",
    "substrate/frame/support", 
    "substrate/frame/balances",
    "substrate/frame/timestamp",
    "substrate/frame/transaction-payment",
    "substrate/frame/quantum-crypto",
    
    # Quantum primitives
    "substrate/primitives/core",
    "substrate/primitives/runtime",
    "substrate/primitives/quantum-wrapper",
    "substrate/primitives/api",
    "substrate/primitives/io",
    
    # Required for building
    "substrate/primitives/storage",
    "substrate/primitives/trie",
    "substrate/primitives/state-machine",
]

exclude = [
    # Exclude all classic consensus
    "substrate/client/consensus/grandpa",
    "substrate/client/consensus/babe",
    "substrate/client/consensus/aura",
    "substrate/primitives/consensus/grandpa",
    "substrate/primitives/consensus/babe",
    "substrate/primitives/consensus/aura",
    
    # Exclude bridges (they depend on GRANDPA)
    "bridges/*",
    
    # Exclude cumulus (parachain stuff)
    "cumulus/*",
    
    # Exclude polkadot (relay chain)
    "polkadot/*",
]

[workspace.package]
authors = ["Quantum Harmony Team"]
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
# Use the same dependency versions as main workspace
codec = { version = "3.6.12", default-features = false, package = "parity-scale-codec" }
scale-info = { version = "2.11.1", default-features = false }
sp-core = { path = "substrate/primitives/core", default-features = false }
sp-runtime = { path = "substrate/primitives/runtime", default-features = false }
sp-std = { path = "substrate/primitives/std", default-features = false }
frame-support = { path = "substrate/frame/support", default-features = false }
frame-system = { path = "substrate/frame/system", default-features = false }

[profile.release]
panic = "unwind"